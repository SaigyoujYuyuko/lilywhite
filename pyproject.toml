[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "lilywhite"
version = "0.3.0"
description = "LilyWhite：基于 Litestar 与 Uvicorn 的 Pythonic 服务端框架"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SaigyoujYuyuko" }]
keywords = ["litestar", "uvicorn", "dependency-injection", "ioc", "asgi", "touhou"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.14"
dependencies = [
    "litestar>=2.25",
    "loguru>=0.7",
    "msgspec>=0.19",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
lilywhite = "lilywhite.__main__:main"

[project.urls]
Homepage = "https://github.com/SaigyoujYuyuko/lilywhite"
Repository = "https://github.com/SaigyoujYuyuko/lilywhite"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=8",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "SIM", "C4", "PERF", "RUF", "PL", "RET", "TRY", "ANN", "D100", "D104"]
ignore = ["PLE1205", "RUF001", "RUF002", "RUF003", "PLR2004", "TRY003", "TRY004"]

[tool.ruff.lint.per-file-ignores]
"lilywhite/config.py" = ["ANN401"]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 22
max-returns = 24
max-statements = 90
max-positional-args = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["lilywhite", "example"]
strict = true
disallow_any_explicit = false
warn_unreachable = true
warn_no_return = true
extra_checks = true
pretty = true
plugins = []

[[tool.mypy.overrides]]
module = ["litestar.*", "loguru.*", "yaml.*"]
ignore_missing_imports = true
