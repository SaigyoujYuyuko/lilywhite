# reuse 模板配置。复制为 config.yaml 后再修改，本地 config.yaml 不进入 Git。
version: 1

server:
  host: 127.0.0.1
  port: 8000

  cors:
    # null 允许直接打开的本地 HTML；[] 关闭 CORS。
    # 也可以改为明确的 HTTP(S) 来源，例如 https://ops.example.com。
    allow_origins: ["null"]

logging:
  # 应用日志级别：TRACE、DEBUG、INFO、WARNING、ERROR、CRITICAL。
  level: INFO

  # Uvicorn 等第三方组件的最低级别，控制台、文件和 SSE 共用。
  third_party_level: WARNING

  console: true

  # null 关闭文件输出；可改为 logs/server.log。
  file: null
  file_rotation_mb: 10
  file_retention_days: 14

  # zip、gz、bz2、xz；null 表示轮转后不压缩。
  file_compression: zip

operations:
  # 全局及每条路由分别保留的最近延迟样本数。
  metrics_window_size: 4096

  # GET /logs/stream 的独立运维 Token；null 关闭日志流。
  # 使用至少 32 个 ASCII 字符的随机值，只写入本地 config.yaml。
  log_access_token: null

features:
  # false 使用默认内存问候；true 切换为春季问候实现。
  spring_greeting: false
